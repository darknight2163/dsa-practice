name: Update Progress Graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - '.github/workflows/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate SVG Progress Chart
        run: python scripts/generate_chart.py

      - name: Commit and Push SVG Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/progress.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update progress chart SVG" && git push)
